name: Build & Release T-CapCut macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install FFmpeg (for engine integration tests)
        run: brew install ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test suite
        run: pnpm test

      - name: Build T-CapCut.app & DMG
        run: pnpm build:app

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: T-CapCut-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
